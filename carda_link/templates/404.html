{% load static i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — CardaLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.3/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="{% static 'css/project.css' %}" rel="stylesheet" />
</head>
<body class="landing-offwhite-body">
  <div class="landing-page-container d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 text-center">

          <!-- Brand -->
          <a href="/" class="text-decoration-none d-inline-block mb-5">
            <span style="font-family: 'Outfit', sans-serif; font-size: 1.75rem; font-weight: 800;">
              <span style="color: #047857;">Carda</span><span style="background: #047857; color: #fff; padding: 2px 10px; border-radius: 8px;">Link</span>
            </span>
          </a>

          <!-- Error Code -->
          <div class="mb-3">
            <span style="font-family: 'Outfit', sans-serif; font-size: 8rem; font-weight: 800; line-height: 1;
                         background: linear-gradient(135deg, #064e3b, #10b981); -webkit-background-clip: text;
                         -webkit-text-fill-color: transparent; background-clip: text;">
              404
            </span>
          </div>

          <!-- Message -->
          <h1 class="h3 fw-bold font-heading text-dark mb-2">Page Not Found</h1>
          <p class="text-muted mb-5" style="max-width: 400px; margin: 0 auto 2rem;">
            The page you're looking for doesn't exist or may have been moved. Let's get you back on track.
          </p>

          <!-- Actions -->
          <div class="d-flex flex-wrap gap-3 justify-content-center">
            <a href="/" class="btn btn-emerald-primary px-5 py-3 fw-bold rounded-pill">
              <i class="bi bi-house-door me-2"></i>Go Home
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-3 rounded-pill fw-semibold">
              <i class="bi bi-arrow-left me-2"></i>Go Back
            </a>
          </div>

          <!-- Helpful Links -->
          <div class="mt-5 pt-4 border-top">
            <p class="text-muted small mb-3">Or navigate to:</p>
            <div class="d-flex flex-wrap gap-2 justify-content-center">
              <a href="/estates/" class="text-emerald text-decoration-none small fw-semibold">
                <i class="bi bi-geo-alt-fill me-1"></i>Estates
              </a>
              <span class="text-muted">·</span>
              <a href="/about/" class="text-emerald text-decoration-none small fw-semibold">
                <i class="bi bi-info-circle me-1"></i>About
              </a>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
