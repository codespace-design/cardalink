{% load static i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Error — CardaLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.2.3/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="{% static 'css/project.css' %}" rel="stylesheet" />
</head>
<body class="landing-offwhite-body">
  <div class="landing-page-container d-flex align-items-center justify-content-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 text-center">

          <!-- Brand -->
          <a href="/" class="text-decoration-none d-inline-block mb-5">
            <span style="font-family: 'Outfit', sans-serif; font-size: 1.75rem; font-weight: 800;">
              <span style="color: #047857;">Carda</span><span style="background: #047857; color: #fff; padding: 2px 10px; border-radius: 8px;">Link</span>
            </span>
          </a>

          <!-- Error Code -->
          <div class="mb-3">
            <div class="mx-auto mb-3 d-flex align-items-center justify-content-center rounded-3"
                 style="width: 80px; height: 80px; background: #fffbeb; color: #d97706; font-size: 2.25rem;">
              <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <span style="font-family: 'Outfit', sans-serif; font-size: 5rem; font-weight: 800; line-height: 1;
                         color: #d97706; opacity: 0.2;">
              500
            </span>
          </div>

          <!-- Message -->
          <h1 class="h3 fw-bold font-heading text-dark mb-2">Something Went Wrong</h1>
          <p class="text-muted mb-5" style="max-width: 420px; margin: 0 auto 2rem;">
            An unexpected error occurred on our end. Our team has been notified. Please try again in a few moments or return to the home page.
          </p>

          <!-- Actions -->
          <div class="d-flex flex-wrap gap-3 justify-content-center">
            <a href="/" class="btn btn-emerald-primary px-5 py-3 fw-bold rounded-pill">
              <i class="bi bi-house-door me-2"></i>Return Home
            </a>
            <a href="javascript:location.reload()" class="btn btn-outline-secondary px-4 py-3 rounded-pill fw-semibold">
              <i class="bi bi-arrow-clockwise me-2"></i>Try Again
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
