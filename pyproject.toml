[project]
name = "carda-link"
version = "0.1.0"
description = "Cardamom auction and estate monitoring system."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Gouri Nandhan P V", email = "gourinandhanpv@gmail.com" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "argon2-cffi==25.1.0",
  "crispy-bootstrap5==2026.3",
  "django==6.0.7",
  "django-allauth[mfa]==65.19.1",
  "django-anymail==15.1",
  "django-cors-headers==4.9.0",
  "django-crispy-forms==2.7",
  "django-environ==0.14.0",
  "django-model-utils==5.0.0",
  "django-ninja==1.6.3",
  "django-redis==7.0.0",
  "django-storages[s3]==1.14.6",
  "gunicorn==26.2.0",
  "hiredis==3.4.1",
  "pillow==12.3.0",
  "psycopg[c]==3.3.4",
  "python-slugify==8.0.4",
  "redis==8.1.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.15.4",
  "django-coverage-plugin==3.2.2",
  "django-debug-toolbar==7.1.1",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==6.1.0",
  "django-upgrade==1.32.0",
  "djlint==1.44.2",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  "psycopg[c]==3.3.4",
  "pytest==9.1.1",
  "pytest-django==4.14.0",
  "pytest-sugar==1.1.1",
  "ruff==0.16.5",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "werkzeug[watchdog]==3.1.8",
]

# ==== djLint ====
[tool.djlint]
profile = "django"
include = "H017,H035"
indent = 2
max_line_length = 119
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
custom_blocks = "slot"
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002,D018,H021,H023"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "BLE001",  # Do not catch blind exception
  "E402",    # Module level import not at top of file
  "E501",    # Line too long
  "EM101",   # Exception must not use a string literal
  "EM102",   # Exception must not use an f-string literal
  "ERA001",  # Found commented-out code
  "EXE001",  # Executable file without shebang
  "EXE002",  # Executable file permissions on Windows git
  "F841",    # Local variable unused
  "FBT001",  # Boolean-typed positional argument
  "FBT002",  # Boolean default positional argument
  "PLC0415", # Import inside function
  "PLR2004", # Magic value used in comparison
  "PT009",   # Use of unittest assertions
  "PT027",   # Use of assertRaises
  "PTH118",  # os.path.join
  "PTH120",  # os.path.dirname
  "PTH123",  # open() should be replaced by Path.open()
  "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
  "RUF059",  # Unpacked variable unused
  "S101",    # Use of assert detected
  "S106",    # Hardcoded password in tests
  "SIM102",  # sometimes it's better to nest
  "SLF001",  # Private member accessed
  "T201",    # print statements
  "TC003",   # Move stdlib import into type-checking block
  "TRY003",  # Avoid specifying long messages outside exception class
]
lint.isort.force-single-line = true

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== mypy ====
[tool.mypy]
ignore_missing_imports = true
python_version = "3.14"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = [
  "mypy_django_plugin.main",
]
warn_unused_configs = true
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== pytest ====
[tool.pytest]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
python_files = [
  "tests.py",
  "test_*.py",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "carda_link/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]
